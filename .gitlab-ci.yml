stages:
  - validate
  - test
  - build
  - publish
  - release

variables:
  DOCKER_IMAGE: wrapparr
  DOCKER_REGISTRY: ${CI_REGISTRY_IMAGE}

# ── Validate ──
lint:backend:
  stage: validate
  image: python:3.12-slim
  script:
    - pip install ruff
    - cd src/backend && ruff check .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint:frontend:
  stage: validate
  image: node:22-alpine
  script:
    - cd src/frontend && npm ci && npx eslint src/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Test ──
test:backend:
  stage: test
  image: python:3.12-slim
  script:
    - cd src/backend && pip install -r requirements.txt && pytest --cov=app
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:frontend:
  stage: test
  image: node:22-alpine
  script:
    - cd src/frontend && npm ci && npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Build ──
build:docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_BUILDKIT: 1
  script:
    - docker build
      --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      --build-arg COMMIT_SHA=${CI_COMMIT_SHA}
      --build-arg VERSION=${CI_COMMIT_TAG:-dev}
      -f docker/Dockerfile
      -t ${DOCKER_REGISTRY}:${CI_COMMIT_TAG:-latest}
      -t ${DOCKER_REGISTRY}:${CI_COMMIT_SHORT_SHA}
      .
    - docker push ${DOCKER_REGISTRY}:${CI_COMMIT_TAG:-latest}
    - docker push ${DOCKER_REGISTRY}:${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Release ──
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    tag_name: ${CI_COMMIT_TAG}
    name: "Wrapparr ${CI_COMMIT_TAG}"
    description: "Release ${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
