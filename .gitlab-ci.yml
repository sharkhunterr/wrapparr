# GitLab CI/CD Pipeline
# Wrapparr - Spotify Wrapped-style media recap for homelab servers

variables:
  PROJECT_TYPE: "fullstack"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  ENABLE_BACKEND_TESTS: "true"
  ENABLE_FRONTEND_TESTS: "true"
  ENABLE_DOCKER_BUILD: "true"
  ENABLE_GITLAB_REGISTRY: "false"
  DOCKER_HUB_ENABLED: "true"
  GITHUB_DEPLOY_ENABLED: "true"
  DOCKER_IMAGE: $CI_PROJECT_NAME
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_MESSAGE =~ /^chore\(release\)/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - validate
  - test
  - build
  - publish
  - deploy
  - release
  - verify

.python_template: &python_template
  image: python:${PYTHON_VERSION}-slim
  cache:
    key: ${CI_COMMIT_REF_SLUG}-backend
    paths:
      - src/backend/.venv/
  before_script:
    - cd src/backend
    - pip install --upgrade pip
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install -r requirements.txt

.node_template: &node_template
  image: node:${NODE_VERSION}-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend
    paths:
      - src/frontend/node_modules/
  before_script:
    - cd src/frontend
    - npm ci

.docker_template: &docker_template
  image: docker:24-cli
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - until docker info; do sleep 1; done

validate:backend:
  stage: validate
  <<: *python_template
  script:
    - . .venv/bin/activate
    - ruff check app/ --fix
    - ruff check app/ || echo "Des erreurs subsistent"
    - ruff format --check app/ || echo "Erreurs de formatage"
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

validate:frontend:
  stage: validate
  <<: *node_template
  script:
    - npm run lint -- --fix || true
    - npm run lint || echo "Erreurs de linting"
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

test:backend:
  stage: test
  <<: *python_template
  script:
    - . .venv/bin/activate
    - pytest --cov=app --cov-report=xml --cov-report=html --junitxml=junit.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      junit: src/backend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: src/backend/coverage.xml
    paths:
      - src/backend/htmlcov/
    expire_in: 1 week
  rules:
    - if: '$ENABLE_BACKEND_TESTS == "true"'

test:frontend:
  stage: test
  <<: *node_template
  script:
    - npm run build
  artifacts:
    when: always
    paths:
      - src/frontend/dist/
    expire_in: 1 week
  rules:
    - if: '$ENABLE_FRONTEND_TESTS == "true"'

build:docker:
  stage: build
  <<: *docker_template
  variables:
    DOCKER_BUILDKIT: 1
  script:
    - |
      docker build \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=${CI_COMMIT_SHA} \
        --build-arg VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA} \
        --tag ${DOCKER_IMAGE}:${CI_COMMIT_SHA} \
        --tag ${DOCKER_IMAGE}:${CI_COMMIT_REF_SLUG} \
        --file docker/Dockerfile \
        .
  rules:
    - if: '$CI_COMMIT_TAG && $ENABLE_DOCKER_BUILD == "true"'

deploy:
  stage: deploy
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: 1
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git curl jq
    - git fetch --unshallow || true
    - until docker info; do sleep 1; done
  script:
    - |
      if [ "$DOCKER_HUB_ENABLED" = "true" ]; then
        docker build \
          --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
          --build-arg VCS_REF=${CI_COMMIT_SHA} \
          --build-arg VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA} \
          --tag ${DOCKER_IMAGE}:${CI_COMMIT_SHA} \
          --file docker/Dockerfile \
          .
        echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin
        DOCKER_HUB_IMAGE="${DOCKER_HUB_USER}/${CI_PROJECT_NAME}"
        docker tag ${DOCKER_IMAGE}:${CI_COMMIT_SHA} ${DOCKER_HUB_IMAGE}:${CI_COMMIT_TAG:-latest}
        docker push ${DOCKER_HUB_IMAGE}:${CI_COMMIT_TAG:-latest}
        if [ -n "$CI_COMMIT_TAG" ]; then
          docker tag ${DOCKER_IMAGE}:${CI_COMMIT_SHA} ${DOCKER_HUB_IMAGE}:latest
          docker push ${DOCKER_HUB_IMAGE}:latest
        fi
      fi
    - |
      if [ "$GITHUB_DEPLOY_ENABLED" = "true" ]; then
        git remote add github https://${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git || true
        if [ -n "$CI_COMMIT_TAG" ]; then
          git push github HEAD:refs/heads/${CI_DEFAULT_BRANCH} --force
          git push github refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG} --force
        else
          git push github HEAD:refs/heads/${CI_COMMIT_REF_NAME} --force
        fi
      fi
  rules:
    - if: '$CI_COMMIT_TAG && $DEPLOY == "true"'

release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script:
    - apk add --no-cache sed gawk
  script:
    - |
      if [ -f GITHUB_RELEASES.md ]; then
        NOTES=$(awk '/^## /{if(found==0){found=1; p=1; next}} /^# v[0-9]/{if(found==1 && p==1){exit}} p{print}' GITHUB_RELEASES.md | sed 's/^---$//' | sed '/^$/N;/^\n$/D')
        [ -z "$NOTES" ] && NOTES="Release ${CI_COMMIT_TAG}"
      else
        NOTES="Release ${CI_COMMIT_TAG}"
      fi
      echo "$NOTES" > /tmp/release_notes.txt
      release-cli create \
        --name "Release ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "$(cat /tmp/release_notes.txt)"
  rules:
    - if: '$CI_COMMIT_TAG'

release:github:
  stage: release
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ -f GITHUB_RELEASES.md ]; then
        NOTES=$(awk '/^## /{if(found==0){found=1; p=1; next}} /^# v[0-9]/{if(found==1 && p==1){exit}} p{print}' GITHUB_RELEASES.md | sed 's/^---$//' | sed '/^$/N;/^\n$/D')
        [ -z "$NOTES" ] && NOTES="Release ${CI_COMMIT_TAG}"
      else
        NOTES="Release ${CI_COMMIT_TAG}"
      fi
      RESPONSE=$(curl -X POST \
        -H "Authorization: token ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github.v3+json" \
        -s -w "\n%{http_code}" \
        "https://api.github.com/repos/${GITHUB_REPO}/releases" \
        -d "$(jq -n --arg tag "${CI_COMMIT_TAG}" --arg name "Release ${CI_COMMIT_TAG}" --arg body "$NOTES" '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')")
      HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
      [ "$HTTP_CODE" -eq 201 ] && echo "Release GitHub creee" || { echo "Erreur HTTP $HTTP_CODE"; exit 1; }
  rules:
    - if: '$CI_COMMIT_TAG && $DEPLOY == "true" && $GITHUB_DEPLOY_ENABLED == "true"'

verify:
  stage: verify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ "$DOCKER_HUB_ENABLED" = "true" ] && [ "$DEPLOY" = "true" ]; then
        DOCKER_HUB_IMAGE="${DOCKER_HUB_USER}/${CI_PROJECT_NAME}"
        TAG="${CI_COMMIT_TAG:-latest}"
        RESPONSE=$(curl -s "https://hub.docker.com/v2/repositories/${DOCKER_HUB_IMAGE}/tags/${TAG}")
        echo "$RESPONSE" | jq -e '.name' > /dev/null 2>&1 && echo "Image Docker Hub OK" || { echo "Image non trouvee"; exit 1; }
      fi
    - |
      if [ "$GITHUB_DEPLOY_ENABLED" = "true" ] && [ "$DEPLOY" = "true" ]; then
        RESPONSE=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
          "https://api.github.com/repos/${GITHUB_REPO}/releases/tags/${CI_COMMIT_TAG}")
        echo "$RESPONSE" | jq -e '.id' > /dev/null 2>&1 && echo "Release GitHub OK" || echo "Release en cours..."
      fi
    - echo "Verification terminee"
  rules:
    - if: '$CI_COMMIT_TAG && $DEPLOY == "true"'
