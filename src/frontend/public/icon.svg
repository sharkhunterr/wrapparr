<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#05050e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A00D"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#E5A00D"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip for 3rd bar: center V to right peak -->
    <clipPath id="clip3">
      <polygon points="235,225 345,405 385,405 275,225"/>
    </clipPath>
    <!-- Clip for 4th bar: right peak to top-right -->
    <clipPath id="clip4">
      <polygon points="315,405 445,135 480,135 350,405"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- W base shape with glow -->
  <g filter="url(#glow)">
    <polyline
      points="72,140 172,400 256,220 340,400 440,140"
      fill="none" stroke="url(#goldV)" stroke-width="38"
      stroke-linecap="round" stroke-linejoin="round"
    />
  </g>

  <!-- Clap stripes on 3rd bar — wider black bands -->
  <g clip-path="url(#clip3)">
    <rect x="210" y="170" width="14" height="280" fill="url(#gold)" transform="rotate(20, 250, 310)"/>
    <rect x="230" y="170" width="22" height="280" fill="#05050e" transform="rotate(20, 270, 310)"/>
    <rect x="258" y="170" width="14" height="280" fill="url(#gold)" transform="rotate(20, 298, 310)"/>
    <rect x="278" y="170" width="22" height="280" fill="#05050e" transform="rotate(20, 318, 310)"/>
    <rect x="306" y="170" width="14" height="280" fill="url(#gold)" transform="rotate(20, 346, 310)"/>
    <rect x="326" y="170" width="22" height="280" fill="#05050e" transform="rotate(20, 366, 310)"/>
    <rect x="354" y="170" width="14" height="280" fill="url(#gold)" transform="rotate(20, 394, 310)"/>
  </g>

  <!-- Clap stripes on 4th bar — wider black bands -->
  <g clip-path="url(#clip4)">
    <rect x="290" y="90" width="14" height="360" fill="url(#gold)" transform="rotate(-24, 330, 270)"/>
    <rect x="310" y="90" width="22" height="360" fill="#05050e" transform="rotate(-24, 350, 270)"/>
    <rect x="338" y="90" width="14" height="360" fill="url(#gold)" transform="rotate(-24, 378, 270)"/>
    <rect x="358" y="90" width="22" height="360" fill="#05050e" transform="rotate(-24, 398, 270)"/>
    <rect x="386" y="90" width="14" height="360" fill="url(#gold)" transform="rotate(-24, 426, 270)"/>
    <rect x="406" y="90" width="22" height="360" fill="#05050e" transform="rotate(-24, 446, 270)"/>
    <rect x="434" y="90" width="14" height="360" fill="url(#gold)" transform="rotate(-24, 474, 270)"/>
  </g>

  <!-- Thin outline -->
  <polyline
    points="72,140 172,400 256,220 340,400 440,140"
    fill="none" stroke="url(#goldV)" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round"
    opacity="0.5"
  />
</svg>
