<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#05050e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="goldB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A00D"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="goldVB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#E5A00D"/>
    </linearGradient>
    <filter id="glowB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spotB" cx="35%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#E5A00D" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="clipLB">
      <polygon points="170,390 256,160 290,160 220,390"/>
    </clipPath>
    <clipPath id="clipRB">
      <polygon points="296,390 380,160 420,160 340,390"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgB)"/>
  <rect width="1280" height="640" fill="url(#spotB)"/>

  <!-- Stars -->
  <circle cx="100" cy="80" r="1" fill="white" opacity="0.3"/>
  <circle cx="300" cy="150" r="0.8" fill="white" opacity="0.2"/>
  <circle cx="500" cy="50" r="1.2" fill="white" opacity="0.25"/>
  <circle cx="780" cy="100" r="0.8" fill="white" opacity="0.3"/>
  <circle cx="1000" cy="60" r="1" fill="white" opacity="0.2"/>
  <circle cx="1180" cy="130" r="0.7" fill="white" opacity="0.25"/>
  <circle cx="200" cy="500" r="0.8" fill="white" opacity="0.15"/>
  <circle cx="1100" cy="520" r="1" fill="white" opacity="0.2"/>

  <!-- Logo icon (left side) -->
  <g transform="translate(180, 110) scale(0.82)">
    <g filter="url(#glowB)">
      <polyline points="72,140 172,400 256,220 340,400 440,140" fill="none" stroke="url(#goldVB)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g clip-path="url(#clipLB)" opacity="0.92">
      <rect x="165" y="160" width="18" height="250" fill="url(#goldB)" transform="rotate(-24, 195, 280)"/>
      <rect x="195" y="160" width="18" height="250" fill="#05050e" transform="rotate(-24, 225, 280)"/>
      <rect x="225" y="160" width="18" height="250" fill="url(#goldB)" transform="rotate(-24, 255, 280)"/>
      <rect x="255" y="160" width="18" height="250" fill="#05050e" transform="rotate(-24, 285, 280)"/>
      <rect x="285" y="160" width="18" height="250" fill="url(#goldB)" transform="rotate(-24, 315, 280)"/>
    </g>
    <g clip-path="url(#clipRB)" opacity="0.92">
      <rect x="288" y="160" width="18" height="250" fill="url(#goldB)" transform="rotate(-24, 318, 280)"/>
      <rect x="318" y="160" width="18" height="250" fill="#05050e" transform="rotate(-24, 348, 280)"/>
      <rect x="348" y="160" width="18" height="250" fill="url(#goldB)" transform="rotate(-24, 378, 280)"/>
      <rect x="378" y="160" width="18" height="250" fill="#05050e" transform="rotate(-24, 408, 280)"/>
      <rect x="408" y="160" width="18" height="250" fill="url(#goldB)" transform="rotate(-24, 438, 280)"/>
    </g>
  </g>

  <!-- Text -->
  <text x="680" y="290" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="88" fill="white" letter-spacing="-2">WRAP<tspan fill="url(#goldB)">PARR</tspan></text>
  <text x="680" y="340" font-family="JetBrains Mono, monospace" font-weight="400" font-size="20" fill="white" opacity="0.3" letter-spacing="6">VOTRE RECAP ANNUEL</text>

  <!-- Tagline -->
  <text x="680" y="400" font-family="Nunito, Arial, sans-serif" font-weight="400" font-size="18" fill="white" opacity="0.2">Films, series, livres, jeux — votre annee en un coup d'oeil</text>

  <!-- Bottom line -->
  <rect x="0" y="630" width="1280" height="10" fill="url(#goldB)" opacity="0.15"/>
</svg>
