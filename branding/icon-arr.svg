<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#05050e"/>
    </linearGradient>
    <linearGradient id="goldA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A00D"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="goldVA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#E5A00D"/>
    </linearGradient>
    <filter id="glowA">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip3A">
      <polygon points="130,195 195,340 225,340 160,195"/>
    </clipPath>
    <clipPath id="clip4A">
      <polygon points="180,340 255,120 285,120 210,340"/>
    </clipPath>
  </defs>

  <!-- Background — rounded square like *arr apps -->
  <rect width="512" height="512" rx="100" fill="url(#bgA)"/>

  <!-- W icon (smaller, top area) -->
  <g filter="url(#glowA)" transform="translate(68, 30) scale(0.74)">
    <polyline
      points="72,140 172,400 256,220 340,400 440,140"
      fill="none" stroke="url(#goldVA)" stroke-width="38"
      stroke-linecap="round" stroke-linejoin="round"
    />
  </g>

  <!-- Clap stripes on W (3rd+4th bars, scaled) -->
  <g transform="translate(68, 30) scale(0.74)">
    <g clip-path="url(#clip3A)">
      <rect x="210" y="170" width="14" height="280" fill="url(#goldA)" transform="rotate(20, 250, 310)"/>
      <rect x="230" y="170" width="22" height="280" fill="#05050e" transform="rotate(20, 270, 310)"/>
      <rect x="258" y="170" width="14" height="280" fill="url(#goldA)" transform="rotate(20, 298, 310)"/>
      <rect x="278" y="170" width="22" height="280" fill="#05050e" transform="rotate(20, 318, 310)"/>
      <rect x="306" y="170" width="14" height="280" fill="url(#goldA)" transform="rotate(20, 346, 310)"/>
      <rect x="326" y="170" width="22" height="280" fill="#05050e" transform="rotate(20, 366, 310)"/>
      <rect x="354" y="170" width="14" height="280" fill="url(#goldA)" transform="rotate(20, 394, 310)"/>
    </g>
    <g clip-path="url(#clip4A)">
      <rect x="290" y="90" width="14" height="360" fill="url(#goldA)" transform="rotate(-24, 330, 270)"/>
      <rect x="310" y="90" width="22" height="360" fill="#05050e" transform="rotate(-24, 350, 270)"/>
      <rect x="338" y="90" width="14" height="360" fill="url(#goldA)" transform="rotate(-24, 378, 270)"/>
      <rect x="358" y="90" width="22" height="360" fill="#05050e" transform="rotate(-24, 398, 270)"/>
      <rect x="386" y="90" width="14" height="360" fill="url(#goldA)" transform="rotate(-24, 426, 270)"/>
      <rect x="406" y="90" width="22" height="360" fill="#05050e" transform="rotate(-24, 446, 270)"/>
      <rect x="434" y="90" width="14" height="360" fill="url(#goldA)" transform="rotate(-24, 474, 270)"/>
    </g>
  </g>

  <!-- "arr" text — *arr style (bottom) -->
  <text x="256" y="440" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="110" letter-spacing="-4">
    <tspan fill="white">wr</tspan><tspan fill="url(#goldA)">arr</tspan>
  </text>

  <!-- Subtle underline -->
  <rect x="130" y="458" width="252" height="3" rx="2" fill="url(#goldA)" opacity="0.3"/>
</svg>
