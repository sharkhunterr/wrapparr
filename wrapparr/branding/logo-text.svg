<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 72">
  <defs>
    <linearGradient id="gtx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A00D"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="gtxV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#E5A00D"/>
    </linearGradient>
    <clipPath id="ct3">
      <polygon points="36,10 53,58 61,58 44,10"/>
    </clipPath>
    <clipPath id="ct4">
      <polygon points="48,58 66,8 74,8 56,58"/>
    </clipPath>
  </defs>

  <!-- W with clap stripes on last 2 bars -->
  <g transform="translate(2, 2)">
    <!-- W base -->
    <polyline points="4,8 22,58 36,22 50,58 68,8" fill="none" stroke="url(#gtxV)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Clap stripes bar 3 -->
    <g clip-path="url(#ct3)">
      <rect x="32" y="8" width="3" height="55" fill="url(#gtx)" transform="rotate(16, 42, 36)"/>
      <rect x="37" y="8" width="4.5" height="55" fill="#05050e" transform="rotate(16, 47, 36)"/>
      <rect x="44" y="8" width="3" height="55" fill="url(#gtx)" transform="rotate(16, 54, 36)"/>
      <rect x="49" y="8" width="4.5" height="55" fill="#05050e" transform="rotate(16, 59, 36)"/>
      <rect x="56" y="8" width="3" height="55" fill="url(#gtx)" transform="rotate(16, 66, 36)"/>
    </g>

    <!-- Clap stripes bar 4 -->
    <g clip-path="url(#ct4)">
      <rect x="44" y="2" width="3" height="60" fill="url(#gtx)" transform="rotate(-20, 54, 32)"/>
      <rect x="49" y="2" width="4.5" height="60" fill="#05050e" transform="rotate(-20, 59, 32)"/>
      <rect x="56" y="2" width="3" height="60" fill="url(#gtx)" transform="rotate(-20, 66, 32)"/>
      <rect x="61" y="2" width="4.5" height="60" fill="#05050e" transform="rotate(-20, 71, 32)"/>
      <rect x="68" y="2" width="3" height="60" fill="url(#gtx)" transform="rotate(-20, 78, 32)"/>
    </g>
  </g>

  <!-- "rapparr" text -->
  <text x="74" y="55" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="50" letter-spacing="-2">
    <tspan fill="white">rap</tspan><tspan fill="url(#gtx)">parr</tspan>
  </text>
</svg>
