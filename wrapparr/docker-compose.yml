services:
  wrapparr-api:
    build: ./backend
    container_name: wrapparr-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  wrapparr-frontend:
    build: ./frontend
    container_name: wrapparr-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      wrapparr-api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wrapparr.rule=Host(`wrapparr.local`)"
      - "traefik.http.services.wrapparr.loadbalancer.server.port=80"

  wrapparr-worker:
    build: ./backend
    container_name: wrapparr-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.scheduler"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: wrapparr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wrapparr
      POSTGRES_USER: wrapparr
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrapparr"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: wrapparr-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
